plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackdingo.livecommentdesk'
    compileSdk 37

    defaultConfig {
        applicationId 'com.blackdingo.livecommentdesk'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
